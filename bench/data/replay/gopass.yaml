source: sources/gopass
golden: golden/gopass.yaml
base: f25fc7b4e19a66ede32e05a073e24fc04c0fdbc8      # 2026-06-11, last commit before the window
strip: [ARCHITECTURE.md, AGENTS.md, CLAUDE.md, docs]  # docs/ changes in the window (ADRs, components.dot): strip all of it
coverage: { roots: [internal, pkg], extensions: [.go] }   # where new code is expected; helpers/ and tests/ are already nodes
dropAtBase: [hibp]                                   # pkg/hibp is created by A-16 (2026-09-10); at base HIBP lived in an external module
